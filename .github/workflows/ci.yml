name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install locked development tools and package
        run: python tools/tasks.py setup
      - name: Source, manifest and documentation checks
        run: python tools/tasks.py lint
      - name: Workflow security review
        run: zizmor --offline --pedantic .github/workflows
      - name: Install checksum-verified repository scanners
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          curl --fail --location --proto '=https' --tlsv1.2 --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Validate workflows and scan full Git history
        env:
          TOOL_DIRECTORY: ${{ runner.temp }}
        run: |
          "$TOOL_DIRECTORY/actionlint" -color -shellcheck= -pyflakes=
          "$TOOL_DIRECTORY/gitleaks" git --redact --no-banner .
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          python -c "import os,re;
          assert re.match(r'^(feat|fix|docs|test|build|ci|chore|refactor|perf|revert)(\([^\r\n]+\))?!?: .+', os.environ['PR_TITLE']),
          'Use a Conventional Commit title, e.g. docs: clarify the support assumption'"

  python:
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.13'
          - os: windows-2025
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/tasks.py setup
      - run: python tools/tasks.py test
      - run: python tools/tasks.py build
      - run: python tools/tasks.py artifacts

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python tools/tasks.py setup
      - name: Bounded differential fuzz checks against an exact partition oracle
        run: python tools/tasks.py fuzz
      - name: Install hash-pinned coverage-guided fuzzing engine
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r fuzz/requirements.txt
      - name: Coverage-guided checks with a deliberate-fault detection control
        run: python fuzz/run_atheris.py --output build/atheris-ci --seconds 60
      - name: Preserve fuzz inputs and execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atheris-ci-receipt
          path: build/atheris-ci/
          if-no-files-found: warn
          retention-days: 14

  flint:
    name: flint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install hash-pinned exact arithmetic dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r examples/requirements-flint.txt
      - name: Check finite-mixture identities and rejection controls independently
        run: |
          mkdir -p build/flint
          python examples/finite_mixture_flint.py > build/flint/result.json
      - name: Preserve exact-arithmetic execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flint-ci-receipt
          path: build/flint/
          if-no-files-found: warn
          retention-days: 14

  sage:
    name: sage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Official SageMath 10.8, linux/amd64 manifest (not a mutable tag).
      SAGE_IMAGE: sagemath/sagemath:10.8@sha256:fb96c7fb10d672f3be0d088399db3aeac52650416d1bb71f74f26429ea35778f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull pinned SageMath runtime
        run: docker pull "$SAGE_IMAGE"
      - name: Run exact projection boundary, membership and witness controls
        run: |
          mkdir -p build/sage
          docker image inspect "$SAGE_IMAGE" > build/sage/image-inspect.json
          sha256sum examples/d1_projection_sage.py > build/sage/source.sha256
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --workdir /work --env PYTHONDONTWRITEBYTECODE=1 "$SAGE_IMAGE" \
            sage -python examples/d1_projection_sage.py --self-test \
            > build/sage/projection-sage.json
          python3 -c "import json; from pathlib import Path; r=json.loads(Path('build/sage/projection-sage.json').read_text()); assert r['sage_version']=='10.8'; assert r['self_tests']=={'boundary_fixtures':7,'exact_membership_comparisons':3375,'original_constraint_witness_checks':1038}, r"
      - name: Reproduce the population-centered scale diagnostic
        run: |
          sha256sum examples/d1_confidence_scale.py > build/sage/scale-source.sha256
          python3 examples/d1_confidence_scale.py > build/sage/confidence-scale.json
      - name: Preserve exact execution receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sage-ci-receipt
          path: build/sage/
          if-no-files-found: warn
          retention-days: 14

  formal:
    name: formal
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install checksum-verified Elan 4.2.4
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --output elan.tar.gz \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          echo '42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  elan.tar.gz' | sha256sum --check
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve pinned dependencies and upstream mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build all six proof modules
        working-directory: lean
        run: lake build
      - name: Fresh module compilation and separate axiom audits
        run: python lean/verify.py --run ci-check
      - name: Compile the D=1 stability extension and check its axioms
        run: python lean/extensions/d1/verify_stability.py --run ci-check
      - name: Fresh core and research extension verification
        run: python lean/extensions/d1-law/verify_law_bridge.py --suite research --run ci-check
      - name: Replay all project declarations with the bundled Lean kernel
        run: python lean/replay.py --proof-run ci-check --run ci-check
      - name: Preserve proof-check receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-ci-receipt
          path: |
            lean/verification/ci-check/
            build/stability/ci-check/*.json
            build/stability/ci-check/*.txt
            build/stability/ci-check/*.audit.lean
            lean/verification/d1-law-research-ci-check/
            build/research/ci-check/*.json
            build/research/ci-check/*.txt
            build/research/ci-check/*.audit.lean
            build/replay/ci-check/*.json
            build/replay/ci-check/*.txt
          if-no-files-found: warn
          retention-days: 14

  ci:
    name: ci
    if: always()
    needs: [quality, python, fuzz, flint, sage, formal]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every component to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 -c "import json,os;
          results=json.loads(os.environ['RESULTS']);
          assert all(job['result']=='success' for job in results.values()), results"
